<div class="login-page">
  <div class="login-card">
    <div class="login-brand-panel">
      <img src="/logo.png" alt="Fortis Asansör" class="login-logo">
    </div>
    <div class="card login-form-card shadow">
      <div class="card-body p-4">
      <div class="text-center mb-4">
        <h1 class="h4 mb-1">Fortis Asansör</h1>
        <p class="text-muted mb-0">{{ registering ? 'Create your client account' : 'Sign in to continue' }}</p>
      </div>

      @if (error) {
        <div class="alert alert-danger">{{ error }}</div>
      }
      @if (warning) {
        <div class="alert alert-warning">{{ warning }}</div>
      }

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" [(ngModel)]="email" required autocomplete="email">
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" [(ngModel)]="password"
                 [attr.minlength]="registering ? 8 : null" required
                 [autocomplete]="registering ? 'new-password' : 'current-password'">
        </div>
        @if (registering) {
          <p class="small text-muted">Your administrator must first add your client record using this email.</p>
        }
        <button class="btn btn-primary w-100" type="submit" [disabled]="submitting">
          {{ submitting ? 'Please wait...' : registering ? 'Create account' : 'Sign in' }}
        </button>
        <button class="btn btn-link w-100 mt-2" type="button" (click)="toggleMode()">
          {{ registering ? 'Back to sign in' : 'Create a client account' }}
        </button>
      </form>
      </div>
    </div>
  </div>
</div>
